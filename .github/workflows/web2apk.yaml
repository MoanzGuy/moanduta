# DUTA Web → APK
# Kontrak SC bot (server.js triggerWeb2ApkWorkflow):
#   workflow_dispatch inputs: jobId, userId, payload (JSON)
#   payload: { mode, url, appName, iconUrl, jobId, userId }
# Artifact WAJIB: name apk-${{ inputs.jobId }}  path output/app.apk

name: DUTA Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID from SC bot
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: false
        default: "0"
        type: string
      payload:
        description: JSON payload { url, appName, iconUrl, ... }
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: duta-web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
    steps:
      - name: Parse payload SC bot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, re
          try:
              p = json.loads(os.environ["PAYLOAD"])
          except Exception as e:
              print(f"Invalid payload JSON: {e}")
              sys.exit(1)

          url = str(p.get("url") or p.get("web_url") or p.get("webUrl") or "").strip()
          app_name = str(p.get("appName") or p.get("app_name") or "Web App").strip() or "Web App"
          icon_url = str(p.get("iconUrl") or p.get("icon_url") or "").strip()
          job_id = str(p.get("jobId") or os.environ.get("JOB_ID") or "").strip()

          if not url.startswith(("http://", "https://")):
              print(f"Invalid URL: {url!r}")
              sys.exit(1)

          # Sanitasi nama app (hindari karakter aneh di label Android)
          app_name = re.sub(r'[\x00-\x1f]', '', app_name)[:40]

          def esc(s):
              return str(s).replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"WEB_URL={esc(url)}\n")
              f.write(f"APP_NAME={esc(app_name)}\n")
              f.write(f"ICON_URL={esc(icon_url)}\n")
              f.write(f"BUILD_JOB_ID={esc(job_id)}\n")

          print(f"URL={url}")
          print(f"APP_NAME={app_name}")
          print(f"ICON={bool(icon_url)}")
          print(f"JOB_ID={job_id}")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat project Flutter WebView
        run: |
          set -euo pipefail
          # package name aman (huruf kecil, underscore)
          SAFE_PKG="$(echo "${APP_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '_' | sed 's/^_//;s/_$//;s/__*/_/g')"
          SAFE_PKG="${SAFE_PKG:-web2apk}"
          SAFE_PKG="$(echo "$SAFE_PKG" | cut -c1-20)"
          flutter create --org com.duta.web2apk --project-name "w2a_${SAFE_PKG}" webapp

      - name: Tambah dependency webview_flutter
        working-directory: webapp
        run: flutter pub add webview_flutter

      - name: Tulis lib/main.dart (template aman via dart-define)
        working-directory: webapp
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String kWebUrl = String.fromEnvironment('WEB_URL', defaultValue: 'https://example.com');
          const String kAppName = String.fromEnvironment('APP_NAME', defaultValue: 'WebView App');

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: kAppName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.blue),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) => setState(() => _loading = true),
                    onPageFinished: (_) => setState(() => _loading = false),
                  ),
                )
                ..loadRequest(Uri.parse(kWebUrl));
            }

            Future<bool> _onWillPop() async {
              if (await _controller.canGoBack()) {
                await _controller.goBack();
                return false;
              }
              return true;
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, _) async {
                  if (didPop) return;
                  if (await _onWillPop()) {
                    if (context.mounted) Navigator.of(context).maybePop();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_loading) const Center(child: CircularProgressIndicator()),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Set label AndroidManifest
        working-directory: webapp
        run: |
          python3 - <<'PY'
          import os, re
          from xml.sax.saxutils import escape
          app_name = escape(os.environ.get("APP_NAME", "Web App"))
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          new_content, count = re.subn(r'android:label="[^"]*"', f'android:label="{app_name}"', content, count=1)
          if count == 0:
              raise SystemExit("android:label tidak ditemukan")
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          print("label:", app_name)
          PY

      - name: Download & pasang icon (opsional)
        if: ${{ env.ICON_URL != '' }}
        working-directory: webapp
        run: |
          set -euo pipefail
          mkdir -p assets/icon
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120 \
            -A "DUTA-WEB2APK/1.0" \
            -o assets/icon/icon.png "$ICON_URL" || {
              echo "Icon download gagal — lanjut tanpa custom icon"
              exit 0
            }
          # Validasi minimal file image
          if [ ! -s assets/icon/icon.png ]; then
            echo "Icon kosong — skip"
            exit 0
          fi
          cat >> pubspec.yaml << 'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
          EOF
          flutter pub add --dev flutter_launcher_icons || true
          dart run flutter_launcher_icons || echo "launcher_icons skip"

      - name: flutter pub get
        working-directory: webapp
        run: flutter pub get

      - name: Build APK release
        working-directory: webapp
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=WEB_URL="$WEB_URL" \
            --dart-define=APP_NAME="$APP_NAME"

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find webapp -type f -name '*.apk' -path '*/outputs/flutter-apk/*' | sort | head -n 1 || true)"
          if [ -z "${APK:-}" ]; then
            APK="$(find webapp -type f -name '*.apk' -size +100k | head -n 1 || true)"
          fi
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan"
            find webapp -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" output/app.apk
          echo "APK: $APK ($(du -h output/app.apk | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # SC bot mencari artifact yang namanya mulai "apk-"
          name: apk-${{ inputs.jobId }}
          path: output/app.apk
          if-no-files-found: error
          retention-days: 2
