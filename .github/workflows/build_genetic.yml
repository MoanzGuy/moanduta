# DUTA Genetic v4 — download pakai dlToken (PAT worker) biar private release tidak 404
name: DUTA Genetic APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID from SC bot
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: false
        default: "0"
        type: string
      payload:
        description: JSON payload from SC bot
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: duta-genetic-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /
          echo "GENETIC_WORKER_VERSION=v4-pattoken-download"

      - name: Parse payload SC bot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          try:
              p = json.loads(os.environ["PAYLOAD"])
          except Exception as e:
              print(f"Invalid payload JSON: {e}")
              sys.exit(1)
          url = str(p.get("url", "")).strip()
          asset_api = str(p.get("assetApiUrl", "") or "").strip()
          dl_token = str(p.get("dlToken", "") or "").strip()
          repo = str(p.get("repo", "") or "").strip()
          mode = str(p.get("buildType", "release")).lower()
          kind = str(p.get("kind", "")).lower()
          if dl_token:
              # Mask token di log GitHub Actions
              print(f"::add-mask::{dl_token}")
          if not url.startswith(("https://", "http://")) and not asset_api.startswith("https://"):
              sys.exit("Invalid source URL in payload")
          if mode in ("genetik", "genetic"):
              mode = "release"
          if mode not in ("debug", "release"):
              mode = "release"
          force = "android" if kind in ("genetic", "genetik") else "auto"
          def esc(s):
              return str(s).replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_URL={esc(url)}\n")
              f.write(f"ASSET_API_URL={esc(asset_api)}\n")
              f.write(f"DL_TOKEN={esc(dl_token)}\n")
              f.write(f"SRC_REPO={esc(repo)}\n")
              f.write(f"BUILD_TYPE={mode}\n")
              f.write(f"FORCE_TYPE={force}\n")
          print(f"URL ok, ASSET_API={bool(asset_api)}, HAS_DL_TOKEN={bool(dl_token)}, BUILD_TYPE={mode}, kind={kind}")
          PY

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input workspace output
          download_ok=false

          # Pakai PAT worker dulu (bisa baca release private), fallback GITHUB_TOKEN
          TOKEN="${DL_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${GH_TOKEN:-}"; fi
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::${TOKEN}"
          fi
          echo "Token present: $([ -n \"$TOKEN\" ] && echo yes || echo no)"

          download_with_token() {
            local url="$1"
            local accept="$2"
            local label="$3"
            for i in 1 2 3 4 5 6; do
              # Simpan headers untuk handle 302 Location
              HTTP=$(curl -sS -D /tmp/dl_headers -o input/source.zip -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: ${accept}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --connect-timeout 20 --max-time 600 \
                "$url" || echo "000")
              # Kalau 302, ikuti Location tanpa strip (signed URL)
              if [ "$HTTP" = "302" ] || [ "$HTTP" = "301" ]; then
                LOC=$(grep -i '^location:' /tmp/dl_headers | tail -1 | tr -d '\r' | sed 's/^[Ll]ocation: //')
                if [ -n "$LOC" ]; then
                  HTTP=$(curl -sS -L -o input/source.zip -w "%{http_code}" \
                    --connect-timeout 20 --max-time 600 \
                    "$LOC" || echo "000")
                fi
              fi
              # Validasi ZIP magic bytes
              if [ "$HTTP" = "200" ] && [ -s input/source.zip ]; then
                if unzip -t input/source.zip >/dev/null 2>&1; then
                  echo "$label OK (HTTP $HTTP, attempt $i)"
                  download_ok=true
                  return 0
                fi
                echo "$label HTTP 200 tapi bukan ZIP (attempt $i): $(head -c 80 input/source.zip | tr '\n' ' ')"
              else
                echo "$label attempt $i → HTTP $HTTP"
              fi
              sleep 3
            done
            return 1
          }

          if [ -n "${ASSET_API_URL:-}" ] && [ -n "$TOKEN" ]; then
            echo "Download via API asset + PAT..."
            download_with_token "$ASSET_API_URL" "application/octet-stream" "API" || true
          fi

          if [ "$download_ok" != "true" ] && [ -n "${SOURCE_URL:-}" ] && [ -n "$TOKEN" ]; then
            echo "Download via browser URL + PAT..."
            download_with_token "$SOURCE_URL" "application/octet-stream" "Browser" || true
          fi

          if [ "$download_ok" != "true" ] && [ -n "${SOURCE_URL:-}" ]; then
            echo "Public fallback..."
            HTTP=$(curl -sS -L -o input/source.zip -w "%{http_code}" \
              -A "SC-BUILD-WORKER/1.0" --connect-timeout 20 --max-time 600 \
              "$SOURCE_URL" || echo "000")
            if [ "$HTTP" = "200" ] && unzip -t input/source.zip >/dev/null 2>&1; then
              download_ok=true
            fi
          fi

          if [ "$download_ok" != "true" ]; then
            echo "::error::Gagal download source ZIP."
            echo "SOURCE_URL=${SOURCE_URL:-}"
            echo "ASSET_API_URL=${ASSET_API_URL:-}"
            echo "HAS_TOKEN=$([ -n \"$TOKEN\" ] && echo yes || echo no)"
            head -c 200 input/source.zip 2>/dev/null || true
            exit 1
          fi

          unzip -q input/source.zip -d workspace
          COUNT=$(find workspace -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(find workspace -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            if [ -n "$ONLY" ]; then
              shopt -s dotglob
              mv "$ONLY"/* workspace/ 2>/dev/null || true
              rmdir "$ONLY" 2>/dev/null || true
            fi
          fi
          echo "Workspace tree:"
          find workspace -maxdepth 4 -type f | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-34" || true
          sdkmanager "platforms;android-35" || true
          sdkmanager "build-tools;34.0.0" || true
          sdkmanager "build-tools;35.0.0" || true
          yes | sdkmanager --licenses >/dev/null || true

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${FORCE_TYPE:-auto}"
          has_pubspec=false; has_gradle=false; has_html=false
          if find workspace -type f -name "pubspec.yaml" -print -quit | grep -q .; then has_pubspec=true; fi
          if find workspace -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit | grep -q .; then has_gradle=true; fi
          if find workspace -type f -name "*.html" -print -quit | grep -q .; then has_html=true; fi
          if [ "$REQUESTED" = "android" ]; then
            if $has_gradle; then echo "type=android" >> "$GITHUB_OUTPUT"; exit 0; fi
            if $has_pubspec; then echo "type=flutter" >> "$GITHUB_OUTPUT"; exit 0; fi
            if $has_html; then echo "type=webview" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "type=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if $has_pubspec; then echo "type=flutter" >> "$GITHUB_OUTPUT"; exit 0; fi
          if $has_gradle; then echo "type=android" >> "$GITHUB_OUTPUT"; exit 0; fi
          if $has_html; then echo "type=webview" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "type=unknown" >> "$GITHUB_OUTPUT"

      - name: Locate Android project
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f workspace/android/settings.gradle ] || [ -f workspace/android/settings.gradle.kts ] || [ -f workspace/android/gradlew ]; then
            ROOT="workspace/android"
          fi
          if [ -z "$ROOT" ]; then
            while IFS= read -r s; do
              d="$(dirname "$s")"
              if [ -f "$d/gradlew" ]; then ROOT="$d"; break; fi
            done < <(find workspace -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          fi
          if [ -z "$ROOT" ]; then
            ROOT="$(find workspace -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname || true)"
          fi
          if [ -z "$ROOT" ]; then
            ROOT="$(find workspace -type f -name gradlew -print -quit | xargs -r dirname || true)"
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::Android project tidak ditemukan"; find workspace -maxdepth 4 -type f | head -80; exit 1
          fi
          echo "ANDROID_PROJECT=$ROOT" >> "$GITHUB_ENV"
          echo "Android root: $ROOT"
          ls -la "$ROOT" | head -30

      - name: Bootstrap Gradle + local.properties
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="8.7"
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER="$(grep -oE 'gradle-[0-9.]+' gradle/wrapper/gradle-wrapper.properties | head -1 | sed 's/gradle-//' || true)"
            [ -n "${VER:-}" ] && GRADLE_VER="$VER"
          fi
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          if [ ! -f "./gradlew" ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              sudo unzip -q /tmp/gradle.zip -d /opt
              sudo ln -sfn "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
            fi
            gradle wrapper --gradle-version "$GRADLE_VER" || true
          fi
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E "s#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip#" \
              gradle/wrapper/gradle-wrapper.properties
          fi
          [ -f "./gradlew" ] && chmod +x ./gradlew
          yes | sdkmanager --licenses >/dev/null || true
          if [ -n "${ANDROID_HOME:-}" ]; then echo "sdk.dir=${ANDROID_HOME}" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          fi
          # Release signing fallback
          if [ -f "app/build.gradle" ] && [ "${BUILD_TYPE}" = "release" ]; then
            if ! grep -q 'signingConfig signingConfigs.debug' app/build.gradle; then
              python3 -c "
          import re,pathlib
          p=pathlib.Path('app/build.gradle')
          t=p.read_text()
          t=re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.debug', t, count=1)
          p.write_text(t)
          " || true
            fi
          fi

      - name: Build native Android APK
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="./gradlew"; [ -f "$GRADLE" ] || GRADLE="gradle"
          chmod +x ./gradlew 2>/dev/null || true
          TASK="assembleDebug"; [ "${BUILD_TYPE}" = "release" ] && TASK="assembleRelease"
          echo "Running: $GRADLE --no-daemon $TASK"
          set +e
          $GRADLE --no-daemon --stacktrace "$TASK"
          CODE=$?
          set -e
          if [ $CODE -ne 0 ] && [ "$TASK" = "assembleRelease" ]; then
            echo "Release gagal → fallback assembleDebug"
            $GRADLE --no-daemon --stacktrace assembleDebug
          elif [ $CODE -ne 0 ]; then
            $GRADLE --no-daemon --stacktrace --refresh-dependencies "$TASK"
          fi

      - name: Collect APK
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$ANDROID_PROJECT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1 || true)"
          [ -z "${APK:-}" ] && APK="$(find "$ANDROID_PROJECT" -type f -name '*.apk' -size +10k | head -1 || true)"
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan"
            find "$ANDROID_PROJECT" -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" output/app.apk
          ls -lh output/app.apk

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter build
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find workspace -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          cd "$ROOT"
          flutter pub get
          if [ "${BUILD_TYPE}" = "debug" ]; then flutter build apk --debug; else flutter build apk --release; fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          APK="$(find . -path '*/build/*' -name '*.apk' -size +10k | head -1)"
          cp "$APK" "$GITHUB_WORKSPACE/output/app.apk"

      - name: Fail if unknown
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "::error::Project tidak dikenali"
          find workspace -maxdepth 4 -type f | head -80
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app.apk
          if-no-files-found: error
          retention-days: 2
