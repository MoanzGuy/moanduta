name: DUTA Genetic APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID from SC bot
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: false
        default: "0"
        type: string
      payload:
        description: JSON payload from SC bot
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: duta-genetic-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Parse payload SC bot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          try:
              p = json.loads(os.environ["PAYLOAD"])
          except Exception as e:
              print(f"Invalid payload JSON: {e}")
              sys.exit(1)
          url = str(p.get("url", "")).strip()
          mode = str(p.get("buildType", "release")).lower()
          kind = str(p.get("kind", "")).lower()
          if not url.startswith(("https://", "http://")):
              sys.exit("Invalid source URL in payload")
          if mode in ("genetik", "genetic"):
              mode = "release"
          if mode not in ("debug", "release"):
              mode = "release"
          # Genetic selalu force android kecuali ZIP jelas Flutter/Web
          force = "android" if kind in ("genetic", "genetik") else "auto"
          def esc(s):
              return str(s).replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_URL={esc(url)}\n")
              f.write(f"BUILD_TYPE={mode}\n")
              f.write(f"FORCE_TYPE={force}\n")
          print(f"URL ok, BUILD_TYPE={mode}, FORCE_TYPE={force}, kind={kind}")
          PY

      - name: Download source ZIP
        run: |
          set -euo pipefail
          mkdir -p input workspace output
          curl --fail --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 600 \
            -A "SC-BUILD-WORKER/1.0" \
            "$SOURCE_URL" -o input/source.zip
          test -s input/source.zip
          unzip -t input/source.zip >/dev/null
          unzip -q input/source.zip -d workspace
          # Flatten single top-level folder
          COUNT=$(find workspace -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(find workspace -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            if [ -n "$ONLY" ]; then
              shopt -s dotglob
              mv "$ONLY"/* workspace/ 2>/dev/null || true
              rmdir "$ONLY" 2>/dev/null || true
            fi
          fi
          echo "Workspace tree:"
          find workspace -maxdepth 4 -type f | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-34" || true
          sdkmanager "platforms;android-35" || true
          sdkmanager "build-tools;34.0.0" || true
          sdkmanager "build-tools;35.0.0" || true
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${FORCE_TYPE:-auto}"

          has_pubspec=false
          has_gradle=false
          has_html=false

          if find workspace -type f -name "pubspec.yaml" -print -quit | grep -q .; then
            has_pubspec=true
          fi
          if find workspace -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit | grep -q .; then
            has_gradle=true
          fi
          if find workspace -type f \( -name "index.html" -o -name "*.html" \) -print -quit | grep -q .; then
            has_html=true
          fi

          if [ "$REQUESTED" = "android" ]; then
            # Genetic: prefer native android. Only use flutter if pubspec exists AND no clear android root.
            if $has_gradle; then
              echo "type=android" >> "$GITHUB_OUTPUT"
              echo "Forced genetic → android"
              exit 0
            fi
            if $has_pubspec; then
              echo "type=flutter" >> "$GITHUB_OUTPUT"
              echo "Forced genetic but only Flutter found"
              exit 0
            fi
            if $has_html; then
              echo "type=webview" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "type=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if $has_pubspec; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if $has_gradle; then
            echo "type=android" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if $has_html; then
            echo "type=webview" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "type=unknown" >> "$GITHUB_OUTPUT"

      # ─── FLUTTER PATH ─────────────────────────────────────────────
      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find workspace -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            exit 1
          fi
          echo "FLUTTER_PROJECT=$ROOT" >> "$GITHUB_ENV"

      - name: Ensure compatible Gradle (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' "$WRAPPER"
            grep distributionUrl "$WRAPPER" || true
          fi

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          flutter --version
          flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$FLUTTER_PROJECT" -type f -path '*/build/*' -name '*.apk' -size +10k | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::APK Flutter tidak ditemukan."
            find "$FLUTTER_PROJECT" -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" output/app.apk
          echo "APK: $APK"

      # ─── NATIVE ANDROID / GENETIC PATH ─────────────────────────────
      - name: Generate app icons (genetic)
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$(find workspace -maxdepth 4 -type f -name generate_icons.py -print -quit || true)"
          if [ -n "${SCRIPT:-}" ]; then
            SCRIPT_DIR="$(dirname "$SCRIPT")"
            echo "Menjalankan generate_icons.py di $SCRIPT_DIR ..."
            (cd "$SCRIPT_DIR" && python3 generate_icons.py) || echo "generate_icons.py gagal, lanjut build"
          else
            echo "generate_icons.py tidak ditemukan, lewati."
          fi

      - name: Locate Android project
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          # 1) Prefer folder that has BOTH settings.gradle* AND gradlew
          while IFS= read -r s; do
            d="$(dirname "$s")"
            if [ -f "$d/gradlew" ] || [ -f "$d/gradlew.bat" ]; then
              ROOT="$d"
              break
            fi
          done < <(find workspace -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)

          # 2) settings.gradle alone
          if [ -z "$ROOT" ]; then
            ROOT="$(find workspace -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname || true)"
          fi

          # 3) gradlew alone
          if [ -z "$ROOT" ]; then
            ROOT="$(find workspace -type f -name gradlew -print -quit | xargs -r dirname || true)"
          fi

          # 4) build.gradle that looks like app module (has com.android.application)
          if [ -z "$ROOT" ]; then
            while IFS= read -r bg; do
              if grep -qE 'com\.android\.(application|library)' "$bg" 2>/dev/null; then
                ROOT="$(dirname "$bg")"
                # climb to parent if this is app/
                parent="$(dirname "$ROOT")"
                if [ -f "$parent/settings.gradle" ] || [ -f "$parent/settings.gradle.kts" ]; then
                  ROOT="$parent"
                fi
                break
              fi
            done < <(find workspace -type f \( -name build.gradle -o -name build.gradle.kts \) | sort)
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Project Android tidak ditemukan di ZIP."
            find workspace -maxdepth 5 -type f | head -120
            exit 1
          fi

          echo "ANDROID_PROJECT=$ROOT" >> "$GITHUB_ENV"
          echo "Android root: $ROOT"
          ls -la "$ROOT" | head -40

      - name: Bootstrap Gradle wrapper
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="8.7"
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER="$(grep -oE 'gradle-[0-9.]+' gradle/wrapper/gradle-wrapper.properties | head -1 | sed 's/gradle-//' || true)"
            [ -n "${VER:-}" ] && GRADLE_VER="$VER"
          fi
          mkdir -p gradle/wrapper

          need_wrapper=false
          if [ ! -f "./gradlew" ]; then need_wrapper=true; fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then need_wrapper=true; fi

          if $need_wrapper; then
            echo "Bootstrapping Gradle wrapper (v$GRADLE_VER)..."
            # Install gradle via SDKMAN-less apt or direct distribution
            if ! command -v gradle >/dev/null 2>&1; then
              curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              sudo unzip -q /tmp/gradle.zip -d /opt
              sudo ln -sfn "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
            fi
            gradle wrapper --gradle-version "$GRADLE_VER" || true
          fi

          # Ensure properties point to a valid distribution
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip#" \
              gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          ls -la gradle/wrapper/ || true
          ls -la ./gradlew 2>/dev/null || true

      - name: Accept Android licenses + local.properties
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          fi
          cat local.properties || true

      - name: Build native Android APK
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi
          if [ "${BUILD_TYPE}" = "debug" ]; then
            TASK="assembleDebug"
          else
            TASK="assembleRelease"
          fi
          echo "Running: $GRADLE --no-daemon $TASK"
          # Retry once on transient download failure
          set +e
          $GRADLE --no-daemon --stacktrace "$TASK"
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "Build gagal sekali — retry..."
            $GRADLE --no-daemon --stacktrace --refresh-dependencies "$TASK"
          fi

      - name: Collect native Android APK
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$ANDROID_PROJECT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1 || true)"
          if [ -z "${APK:-}" ]; then
            APK="$(find "$ANDROID_PROJECT" -type f -name '*.apk' -size +10k | head -1 || true)"
          fi
          if [ -z "${APK:-}" ]; then
            echo "::error::APK Android tidak ditemukan."
            find "$ANDROID_PROJECT" -name '*.apk' -print || true
            find "$ANDROID_PROJECT" -type d -name outputs | head -20 || true
            exit 1
          fi
          cp "$APK" output/app.apk
          echo "APK: $APK ($(du -h output/app.apk | cut -f1))"

      # ─── WEBVIEW FALLBACK ─────────────────────────────────────────
      - name: Scaffold WebView project
        if: steps.detect.outputs.type == 'webview'
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(find workspace -type f -name index.html -print -quit || true)"
          if [ -z "${HTML:-}" ]; then
            HTML="$(find workspace -type f -name '*.html' -print -quit || true)"
          fi
          if [ -z "${HTML:-}" ]; then
            echo "::error::Tidak ada HTML di ZIP."
            exit 1
          fi
          HTML_DIR="$(dirname "$HTML")"
          mkdir -p webview/app/src/main/assets webview/app/src/main/java/com/duta/webview webview/app/src/main/res/xml
          cp -r "$HTML_DIR"/* webview/app/src/main/assets/ 2>/dev/null || true

          cat > webview/settings.gradle <<'EOF'
          rootProject.name = "DutaWebView"
          include ":app"
          EOF

          cat > webview/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.5.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > webview/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > webview/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "com.duta.webview"
              compileSdk 34
              defaultConfig {
                  applicationId "com.duta.webview"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > webview/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:allowBackup="true"
              android:label="Duta Web"
              android:usesCleartextTraffic="true"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > webview/app/src/main/java/com/duta/webview/MainActivity.java <<'EOF'
          package com.duta.webview;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cd webview
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            sudo ln -sfn /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          fi
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build WebView APK
        if: steps.detect.outputs.type == 'webview'
        working-directory: webview
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect WebView APK
        if: steps.detect.outputs.type == 'webview'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find webview -type f -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1)"
          if [ -z "${APK:-}" ]; then
            echo "::error::APK WebView tidak ditemukan."
            exit 1
          fi
          cp "$APK" output/app.apk

      - name: Unsupported ZIP
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "::error::ZIP tidak berisi project Android, Flutter, atau Web."
          find workspace -maxdepth 4 -type f | head -100
          exit 1

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- detect type ---"; echo "${{ steps.detect.outputs.type }}"
          echo "--- BUILD_TYPE ---"; echo "${BUILD_TYPE:-?}"
          echo "--- FORCE_TYPE ---"; echo "${FORCE_TYPE:-?}"
          echo "--- workspace ---"; find workspace -maxdepth 5 -type f | sort | head -200 || true
          echo "--- gradle props ---"
          find workspace -name 'gradle-wrapper.properties' -exec echo "FILE:{}" \; -exec cat {} \; 2>/dev/null || true
